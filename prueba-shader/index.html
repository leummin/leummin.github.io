<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>metal-shader-0</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #f4eddd;
        font:
          14px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: grid;
        gap: 4px;
        padding: 10px 12px;
        background: rgba(11, 16, 32, 0.72);
        border: 1px solid rgba(214, 178, 94, 0.45);
        border-radius: 8px;
      }
      #hud b {
        font-variant-numeric: tabular-nums;
        color: #d6b25e;
      }
      #bar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        background: rgba(11, 16, 32, 0.72);
        border-radius: 8px;
      }
      button {
        background: #18213d;
        color: #f4eddd;
        border: 1px solid #283456;
        border-radius: 6px;
        padding: 6px 10px;
      }
      button[aria-pressed='true'] {
        border-color: #d6b25e;
        color: #d6b25e;
      }
      input[type='range'] {
        width: min(420px, 60vw);
      }
    </style>
    <script type="module" crossorigin src="./assets/probe-DKAzV_KY.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/opentype-CkibRBCm.js">
  </head>
  <body>
    <div id="root" data-testid="metal-shader"></div>
    <div id="hud">
      <div>fps <b id="fps">–</b></div>
      <div>ms <b id="ms">–</b></div>
      <div>ratio <b id="ratio">–</b></div>
      <div>size <b id="size">–</b></div>
    </div>
    <div id="bar">
      <label>t <input id="t" type="range" min="0" max="1" step="0.001" value="0" /></label>
      <label><input id="loop" type="checkbox" checked /> auto</label>
      <button type="button" data-pr="1">1</button>
      <button type="button" data-pr="1.5">1.5</button>
      <button type="button" data-pr="2">2</button>
      <button type="button" data-pr="device" aria-pressed="true">device</button>
    </div>
  </body>
</html>
